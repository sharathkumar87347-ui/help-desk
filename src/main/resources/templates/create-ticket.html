<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Ticket - Help Desk</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .header {
            background-color: #0d6efd;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 100px;
        }

        .button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .success {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #0d6efd;
            color: white;
        }

        .delete-button {
            background-color: #dc3545;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

        .delete-button:hover {
            background-color: #bb2d3b;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Help Desk Ticketing System</h1>
</div>

<div class="container">

    <!-- CREATE TICKET -->
    <div class="card">

        <h2>Create New Ticket</h2>

        <div class="success"
             th:if="${success}"
             th:text="${success}">
        </div>

        <form action="/create-ticket" method="post">

            <label>Ticket Title</label>
            <input type="text"
                   name="title"
                   placeholder="Enter ticket title"
                   required>

            <label>Description</label>
            <textarea name="description"
                      placeholder="Describe your problem"
                      required></textarea>

            <label>Category</label>
            <select name="category" required>
                <option value="">Select Category</option>
                <option value="Hardware">Hardware</option>
                <option value="Software">Software</option>
                <option value="Network">Network</option>
                <option value="Other">Other</option>
            </select>

            <label>Priority</label>
            <select name="priority" required>
                <option value="">Select Priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit" class="button">
                Submit Ticket
            </button>

        </form>

        <a href="/dashboard" class="back">
            Back to Dashboard
        </a>

    </div>


    <!-- MY TICKETS -->
    <div class="card">

        <h2>My Tickets</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="ticket : ${tickets}">

                    <td th:text="${ticket.ticket_id}"></td>

                    <td th:text="${ticket.title}"></td>

                    <td th:text="${ticket.description}"></td>

                    <td th:text="${ticket.priority}"></td>

                    <td th:text="${ticket.status}"></td>

                    <td th:text="${ticket.created_at}"></td>

                    <td>
                        <a th:href="@{/delete-ticket(id=${ticket.ticket_id})}"
                           class="delete-button"
                           onclick="return confirm('Are you sure you want to delete this ticket?');">
                            Delete
                        </a>
                    </td>

                </tr>

            </tbody>

        </table>

        <p th:if="${#lists.isEmpty(tickets)}">
            No tickets created yet.
        </p>

    </div>

</div>

</body>
</html>
